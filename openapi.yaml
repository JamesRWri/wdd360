openapi: 3.0.3
info:
  title: SleepOutside API
  description: API documentation for products and alerts in the SleepOutside application.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
paths:
  /products:
    get:
      summary: Get all products with filtering, field selection, and pagination
      parameters:
        - name: q
          in: query
          description: Search query string
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category (tents, backpacks, sleeping-bags, hammocks)
          required: false
          schema:
            type: string
            enum: [tents, backpacks, sleeping-bags, hammocks]
        - name: fields
          in: query
          description: Array of fields to include in response
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          description: Number of results to return
          required: false
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          description: Number of results to skip
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful response returning paginated products
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type: string
                    nullable: true
                  previous:
                    type: string
                    nullable: true
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '400':
          description: Bad request / invalid query parameters
        '500':
          description: Internal server error

  /products/{id}:
    get:
      summary: Get a single product by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Unique product ID
          schema:
            type: string
      responses:
        '200':
          description: Successful response returning the product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Product not found
        '500':
          description: Internal server error

  /alerts:
    get:
      summary: Get all alerts
      responses:
        '200':
          description: List of alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
        '400':
          description: Bad request
        '500':
          description: Internal server error
    post:
      summary: Create a new alert (Protected)
      responses:
        '201':
          description: Alert created successfully
        '400':
          description: Invalid input data
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /alerts/{id}:
    get:
      summary: Get a single alert by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alert details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '404':
          description: Alert not found
        '500':
          description: Internal server error
    put:
      summary: Update an alert (Protected)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alert updated successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Alert not found
        '500':
          description: Internal server error
    delete:
      summary: Delete an alert (Protected)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Alert deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Alert not found
        '500':
          description: Internal server error

components:
  schemas:
    Product:
      type: object
      properties:
        _id:
          type: string
        id:
          type: string
        isClearance:
          type: boolean
        category:
          type: string
          enum: [tents, backpacks, sleeping-bags, hammocks]
        isNew:
          type: boolean
        url:
          type: string
        reviews:
          type: object
          properties:
            reviewsUrl:
              type: string
            reviewCount:
              type: number
            averageRating:
              type: number
        nameWithoutBrand:
          type: string
        name:
          type: string
        descriptionHtmlSimple:
          type: string
        suggestedRetailPrice:
          type: number
        listPrice:
          type: number
        finalPrice:
          type: number

    Alert:
      type: object
      required:
        - _id
        - title
        - type
        - status
        - createdAt
        - modifiedAt
      properties:
        _id:
          type: string
        title:
          type: string
          description: The title of the alert, must not be blank
        type:
          type: string
          enum: [warning, info, promotion]
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time