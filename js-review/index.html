<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WDD 360 - JavaScript Review (Pokémon Explorer)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>WDD 360: JavaScript Review</h1>
  </header>

  <main>
    <section class="pokemon-app">
      <div class="list-container">
        <h2>Select a Pokémon</h2>
        <ul id="pokemon-list"></ul>
      </div>

      <div class="details-container">
        <h2>Details</h2>
        <div id="pokemon-details">
          <p class="placeholder">Click a Pokémon on the left to see details here.</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 | WDD 360 JavaScript Review Activity</p>
  </footer>

  <script src="main.js" type="module"></script>
</body>
</html>
