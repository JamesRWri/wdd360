<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeScript Pokémon Explorer</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 1rem;
      }
      section {
        display: grid;
        grid-template-columns: 200px auto;
        gap: 2rem;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        margin-bottom: 0.25rem;
      }
      button {
        cursor: pointer;
        padding: 0.4rem 0.8rem;
        width: 100%;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pokemon List</h1>
      <section>
        <ul id="pokemon-list"></ul>
        <div id="pokemon-details"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
